<style>

.thumb{max-height:160px;border-radius:10px;object-fit:cover;width:100%}
.ex-list{display:flex;flex-direction:column;gap:8px;counter-reset:ex}
.ex{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .n{font-family:var(--f-display);font-weight:700;color:var(--olive);grid-row:span 2}
.ex .how{font-size:13px;color:var(--muted);grid-column:2}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px}
.week i{width:26px;height:26px;border-radius:99px;border:2px solid var(--line);display:block}
.week i.on{background:var(--olive);border-color:var(--olive)}
.player{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.player .phase{font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--muted)}
.player .big{font-family:var(--f-display);font-size:96px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.player.rest .big{color:var(--water)}
.player h2{font-size:26px}
.player .ctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.player .ctl button{padding:14px}
ul.tips{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}
@media (max-width:380px){.ring-wrap{grid-template-columns:1fr;justify-items:center}.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.bar>i,.ring-fg{transition:all .4s ease}}
</style>

<script>
/* ---------- قاعدة الأكلات (السعرات والبروتين للحصة) ---------- */
const FOODS=[
 ["خبز","خبز طابون (رغيف)",270,9],["خبز","خبز عربي كبير (رغيف)",250,8],["خبز","خبز عربي صغير",120,4],["خبز","خبز شراك (قطعة)",200,6],["خبز","خبز أسمر (رغيف)",190,8],["خبز","كعك بسمسم",300,9],["خبز","منقوشة زعتر",350,8],["خبز","فطيرة سبانخ",250,6],
 ["فطور","حمص (صحن مع زيت)",350,12],["فطور","فول مدمس (صحن)",280,15],["فطور","فلافل (حبة)",55,2],["فطور","لبنة (ملعقتين)",100,5],["فطور","جبنة بيضاء (50غ)",160,9],["فطور","بيضة مسلوقة",75,6],["فطور","بيضة مقلية",95,6],["فطور","عجة بيض (بيضتين)",200,13],["فطور","زيت زيتون (ملعقة كبيرة)",120,0],["فطور","زعتر (ملعقة)",20,1],["فطور","زيتون (10 حبات)",50,0],["فطور","طحينة (ملعقة)",90,3],["فطور","حلاوة طحينية (30غ)",160,4],["فطور","مربى (ملعقة)",50,0],["فطور","شكشوكة (صحن)",300,14],
 ["طبيخ","مسخن (ربع رغيف مع دجاج)",550,25],["طبيخ","مقلوبة (صحن)",600,25],["طبيخ","منسف (صحن)",750,35],["طبيخ","مجدرة (صحن)",400,14],["طبيخ","ملوخية مع رز",450,20],["طبيخ","رز أبيض (كوب)",205,4],["طبيخ","مفتول (صحن)",650,25],["طبيخ","ورق عنب (حبة)",35,1],["طبيخ","محشي كوسا (حبة)",90,4],["طبيخ","شوربة عدس (صحن)",230,13],["طبيخ","بامية باللحمة مع رز",500,22],["طبيخ","فاصولياء مع رز",480,18],["طبيخ","معكرونة (صحن)",400,13],["طبيخ","قدرة (صحن)",650,30],
 ["لحوم","صدر دجاج مشوي (150غ)",250,46],["لحوم","ربع دجاجة مشوية",330,30],["لحوم","كباب (سيخ)",200,14],["لحوم","شيش طاووق (سيخ)",150,22],["لحوم","كفتة بالطحينة (صحن)",600,30],["لحوم","سمك مشوي (200غ)",280,40],["لحوم","تونة (علبة مصفاة)",130,28],["لحوم","لحمة مسلوقة (100غ)",250,26],
 ["سريع","ساندويش فلافل",450,13],["سريع","شاورما دجاج",550,30],["سريع","شاورما لحمة",600,28],["سريع","برغر",550,28],["سريع","بطاطا مقلية (صحن وسط)",365,4],["سريع","بيتزا (قطعة)",285,12],["سريع","زنجر",600,27],["سريع","شيبس (كيس صغير)",160,2],
 ["خضار","سلطة خضار بدون زيت",40,2],["خضار","سلطة عربية مع زيت",120,2],["خضار","فتوش (صحن)",200,4],["خضار","تبولة (صحن)",180,4],["خضار","خيار (حبة)",15,1],["خضار","بندورة (حبة)",22,1],["خضار","جزر (حبة)",25,1],
 ["فواكه","تفاح (حبة)",95,0],["فواكه","موز (حبة)",105,1],["فواكه","برتقال (حبة)",62,1],["فواكه","عنب (كوب)",104,1],["فواكه","بطيخ (شريحة)",85,2],["فواكه","تمر (حبة)",23,0],["فواكه","تين (حبة)",37,0],["فواكه","رمان (حبة)",230,5],
 ["حلو","كنافة (قطعة)",450,9],["حلو","بقلاوة (قطعة)",120,2],["حلو","قطايف مقلية (حبة)",200,4],["حلو","هريسة (قطعة)",250,3],["حلو","شوكولاتة (لوح صغير)",230,3],["حلو","بسكوت (3 حبات)",150,2],["حلو","مكسرات (حفنة 30غ)",175,6],["حلو","بزر (حفنة 30غ)",170,7],
 ["مشروبات","شاي بسكر (ملعقتين)",35,0],["مشروبات","شاي بدون سكر",2,0],["مشروبات","قهوة عربي سادة",5,0],["مشروبات","قهوة تركي بسكر",40,0],["مشروبات","نسكافيه بحليب وسكر",120,3],["مشروبات","لبن رايب (كوب)",150,8],["مشروبات","حليب كامل (كوب)",150,8],["مشروبات","كولا (علبة)",140,0],["مشروبات","كولا دايت",1,0],["مشروبات","عصير برتقال (كوب)",110,2],["مشروبات","مشروب طاقة (علبة)",115,0]
];
const CATS=["الكل","خبز","فطور","طبيخ","لحوم","سريع","خضار","فواكه","حلو","مشروبات","أكلاتي"];
const MEALS=["فطور","غداء","عشاء","سناك"];
const ACT=[[1.2,"مكتبي (جلوس أغلب اليوم)"],[1.375,"خفيف (مشي بسيط يومياً)"],[1.55,"متوسط (رياضة 3-5 أيام)"]];

/* ---------- الحالة والتخزين ---------- */
const KEY="mizan-v1";
const today=()=>dkey(new Date());
function dkey(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function addDays(k,n){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return dkey(d)}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
const DEF={profile:{name:"إسلام",sex:"m",age:36,height:173,activity:1.2,start:90,target:75,pace:0.5,stepGoal:8000,startDate:today()},
  weights:[{d:today(),w:90}],food:{},water:{},walk:{},steps:{},workouts:{},exLevel:0,custom:[]};
let S;
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):JSON.parse(JSON.stringify(DEF))}catch(e){S=JSON.parse(JSON.stringify(DEF))}
  for(const k in DEF) if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(DEF[k]));if(!S.profile.stepGoal)S.profile.stepGoal=8000}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(window.Android)try{Android.saveSummary(JSON.stringify(summary()))}catch(e){}}
/* ملخص يقرأه تطبيق الأندرويد ليرسل الإشعارات والتطبيق مسكّر */
function summary(){const C=calc(),k=today(),steps=S.steps[k]||0;
  const dates=o=>Object.keys(o).filter(d=>(o[d]||[]).length).sort().pop()||"";
  return{date:k,steps,stepGoal:S.profile.stepGoal||8000,water:S.water[k]||0,waterGoal:C.water,eaten:kcalOf(k),
    budget:C.target+Math.round((walkKcal(steps)+exKcal(k))/2),lastWorkout:dates(S.workouts||{})||S.profile.startDate,
    lastWeight:[...S.weights].map(x=>x.d).sort().pop()||""}}
load();

/* ---------- الحسابات ---------- */
function curW(){const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].w:S.profile.start}
function calc(){
  const p=S.profile,w=curW();
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  const tdee=bmr*p.activity;
  const floor=p.sex==="m"?1500:1200;
  const target=Math.max(Math.round((tdee-p.pace*7700/7)/10)*10,floor);
  const bmi=w/((p.height/100)**2);
  const left=Math.max(w-p.target,0);
  const weeks=left/p.pace;
  const goalDate=addDays(today(),Math.round(weeks*7));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),target,protein:Math.round(1.6*p.target),
    water:Math.round(w*35/250),bmi,left,weeks,goalDate,w,
    healthy:[Math.round(18.5*(p.height/100)**2),Math.round(24.9*(p.height/100)**2)]}
}
const dayFood=k=>S.food[k]||[];
const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);
const kcalOf=k=>Math.round(sum(dayFood(k),x=>x.kcal));
const walkKcal=st=>Math.round(st*0.045*curW()/90);
function bmiLabel(b){return b<18.5?"نحافة":b<25?"وزن صحي":b<30?"زيادة وزن":"سمنة"}
function fmtDate(k){const d=new Date(k+"T12:00:00");return d.toLocaleDateString("ar",{day:"numeric",month:"long",year:"numeric"})}
function fmtShort(k){const d=new Date(k+"T12:00:00");return d.toLocaleDateString("ar",{day:"numeric",month:"short"})}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- واجهة ---------- */
let tab="home",sheet=null;
const app=document.getElementById("app");
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  app.innerHTML=({home:vHome,food:vFood,weight:vWeight,ex:vEx,coach:vCoach,plan:vPlan}[tab])();
  document.querySelector(".sheet-bg")?.remove();
  if(sheet) document.body.insertAdjacentHTML("beforeend",sheet());
  const n=alerts().filter(a=>a[0]==="r").length,hb=document.querySelector('[data-tab="home"]');
  hb.querySelector(".badge")?.remove();
  if(n) hb.insertAdjacentHTML("beforeend",`<span class="badge num">${n}</span>`);
}

/* ---------- الإنذارات: تقارن ما فعلته بما يجب أن تكون فعلته حتى هذه الساعة ---------- */
function dayFrac(from,to){const d=new Date(),h=d.getHours()+d.getMinutes()/60;return Math.max(0,Math.min((h-from)/(to-from),1))}
function alerts(){
  const C=calc(),k=today(),h=new Date().getHours(),out=[];
  /* المشي: أنت حر بوقته. التنبيه فقط إذا صار الوقت ضيق على إكمال هدف اليوم */
  const steps=S.steps[k]||0,goal=S.profile.stepGoal||8000,miss=goal-steps,now=new Date(),hLeft=Math.max(23-(now.getHours()+now.getMinutes()/60),0),mins=Math.ceil(miss/100);
  if(miss>0&&h>=17){
    const tight=mins>hLeft*60*0.35||h>=21;
    if(tight) out.push(["r","الوقت صار ضيق على المشي","باقي "+miss.toLocaleString("en")+" خطوة (حوالي "+mins+" دقيقة) وما ضل من اليوم إلا "+Math.floor(hLeft)+" ساعات. لازم تمشي الليلة."]);
    else if(h>=19) out.push(["w","ما خلّصت مشي اليوم","باقي "+miss.toLocaleString("en")+" خطوة، حوالي "+mins+" دقيقة. اختار أي وقت يناسبك قبل النوم."]);
  }
  const water=S.water[k]||0,expW=Math.floor(C.water*dayFrac(8,22));
  if(water<expW-1) out.push([water<expW-3?"r":"w","الماء متأخر","شربت "+water+" كاسات والمفروض "+expW+" لهلأ. اشرب كاستين الآن."]);
  const items=dayFood(k),eaten=kcalOf(k),bonus=Math.round((walkKcal(steps)+exKcal(k))/2),budget=C.target+bonus;
  if(eaten>budget) out.push(["r","تجاوزت سعرات اليوم","زيادة "+(eaten-budget)+" سعرة. ممنوع أي أكل إضافي اليوم إلا خضار وماء، أو امشِ "+Math.ceil((eaten-budget)/walkKcal(100))+" دقيقة لتعوّض."]);
  else if(h<18&&eaten>budget-250&&eaten>0) out.push(["w","قربت تخلص سعراتك","باقي "+(budget-eaten)+" سعرة فقط لباقي اليوم. العشا لازم يكون خفيف جداً."]);
  if(h>=14&&!items.length) out.push(["w","ما سجلت أي أكلة","إذا أكلت سجّلها الآن. الأكل اللي ما بنسجله هو اللي بيوقف النزول."]);
  const prot=sum(items,x=>x.p);
  if(h>=18&&items.length&&prot<C.protein*0.6) out.push(["w","البروتين ناقص","أكلت "+Math.round(prot)+"غ من "+C.protein+"غ. خلّي العشا بيض أو لبن أو دجاج أو تونة."]);
  if(items.some(x=>x.t&&x.t>=22)) out.push(["w","أكل متأخر","سجّلت أكل بعد الساعة 10 بالليل. سكّر المطبخ بعد العشا."]);
  const exDays=Object.keys(S.workouts).filter(d=>(S.workouts[d]||[]).length).sort();
  const lastEx=exDays.pop(),gap=lastEx?daysBetween(lastEx,k):daysBetween(S.profile.startDate,k);
  if(gap>=3&&!(S.workouts[k]||[]).length) out.push(["w","صار لك "+gap+" أيام بدون تمارين","20 دقيقة تمارين بطن وخواصر اليوم، بأي وقت يناسبك."]);
  const lastW=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).pop();
  if(lastW&&daysBetween(lastW.d,k)>=7) out.push(["w","ما وزنت حالك من "+daysBetween(lastW.d,k)+" يوم","وزن الأسبوع مطلوب. سجّله بكرة الصبح قبل الفطور."]);
  return out;
}

function ring(eaten,target){
  const r=56,c=2*Math.PI*r,pct=Math.min(eaten/target,1),over=eaten>target;
  return `<svg viewBox="0 0 132 132" role="img" aria-label="سعرات اليوم">
   <circle cx="66" cy="66" r="${r}" stroke="var(--line)" stroke-width="12" fill="none"/>
   <circle class="ring-fg" cx="66" cy="66" r="${r}" stroke="${over?"var(--sumac)":"var(--olive)"}" stroke-width="12" fill="none" stroke-linecap="round"
     stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 66 66)"/>
   <text x="66" y="62" text-anchor="middle" class="ring-center" font-size="24" font-weight="700" fill="var(--fg)">${Math.abs(target-eaten)}</text>
   <text x="66" y="84" text-anchor="middle" font-size="12" fill="var(--muted)">${over?"زيادة":"متبقي"}</text></svg>`
}

function vHome(){
  const C=calc(),k=today(),eaten=kcalOf(k),steps=S.steps[k]||0,goal=S.profile.stepGoal,burn=walkKcal(steps),bonus=Math.round((burn+exKcal(k))/2);
  const AL=alerts();
  const budget=C.target+bonus,prot=Math.round(sum(dayFood(k),x=>x.p)),water=S.water[k]||0;
  const meals=new Set(dayFood(k).map(x=>x.meal)).size;
  const lost=(S.profile.start-C.w),totalToLose=S.profile.start-S.profile.target;
  const prog=totalToLose>0?Math.max(0,Math.min(lost/totalToLose,1)):0;
  // آخر 7 أيام
  const days=[...Array(7)].map((_,i)=>addDays(k,i-6));
  const maxK=Math.max(C.target*1.3,...days.map(kcalOf));
  const bw=34,gap=12,H=110,Wd=7*bw+6*gap;
  const bars=days.map((d,i)=>{const v=kcalOf(d),h=v/maxK*H,x=Wd-(i+1)*bw-i*gap;
    return `<rect x="${x}" y="${H-h+4}" width="${bw}" height="${Math.max(h,2)}" rx="5" fill="${v>C.target?"var(--sumac)":v?"var(--olive)":"var(--line)"}"/>
    <text x="${x+bw/2}" y="${H+20}" text-anchor="middle">${new Date(d+"T12:00:00").toLocaleDateString("ar",{weekday:"short"})}</text>`}).join("");

  ${AL.length?`<section class="card alarm" role="alert"><div class="row between"><h2>${AL.some(a=>a[0]==="r")?"إنذار: أنت مقصّر":"انتبه"}</h2><span class="pill warn">${AL.length}</span></div>
    ${AL.map(x=>`<div class="advice ${x[0]}"><i></i><div><b>${esc(x[1])}</b><div class="small">${esc(x[2])}</div></div></div>`).join("")}</section>`
   :`<section class="card ok"><b>ملتزم حتى الآن 👍</b><span class="small muted">كل المطلوب لهذه الساعة منجز. كمّل.</span></section>`}
  <section class="card">
    <div class="ring-wrap">${ring(eaten,budget)}
      <div class="grid2">
        <div class="stat"><b>${budget}</b><span>هدف اليوم</span></div>
        <div class="stat"><b>${eaten}</b><span>أكلت</span></div>
        <div class="stat"><b>${bonus}</b><span>مكافأة الحركة</span></div>
        <div class="stat"><b>${prot}<small class="muted"> / ${C.protein}غ</small></b><span>بروتين</span></div>
      </div></div>
    <div class="row between"><span class="small muted">عدد مرات الأكل اليوم: <b class="num">${meals}</b></span>
      <button class="btn-main" data-act="open-add">+ أضف أكلة</button></div>
    <button data-act="go-adv">📷 اسألني قبل ما تاكل</button>
  </section>
  <section class="card">
    <div class="row between"><h2>الماء</h2><span class="num">${water} / ${C.water} كاسات</span></div>
    <div class="cups">${[...Array(Math.max(C.water,water))].map((_,i)=>`<button class="cup ${i<water?"on":""}" data-act="water" data-n="${i+1}" aria-label="كاس ${i+1}"></button>`).join("")}</div>
    <span class="small muted">الكاس = 250 مل. اشرب كاسة قبل كل أكلة، يقلل الجوع.</span>
  </section>
  <section class="card" id="steps-card">
    <div class="row between"><h2>المشي</h2><span class="num">${steps.toLocaleString("en")} / ${goal.toLocaleString("en")} خطوة</span></div>
    <div class="bar"><i style="width:${Math.min(steps/goal*100,100)}%"></i></div>
    <div class="small muted">${steps>=goal?"خلّصت هدف اليوم 👏":"باقي "+(goal-steps).toLocaleString("en")+" خطوة، امشيها بالوقت اللي يناسبك"} · حرقت ${burn} سعرة</div>
    <div class="grid3">
      <label style="grid-column:span 2">عداد خطوات جوالك<input id="st" type="number" inputmode="numeric" placeholder="مثلاً 4250" value="${steps||""}"></label>
      <button class="btn-main" data-act="set-steps" style="align-self:end">تحديث</button>
    </div>
    ${window.Android?(health==="ok"?`<span class="small" style="color:var(--olive)">● الخطوات تُقرأ تلقائياً من جوالك</span>`
      :`<div class="advice w"><i></i><div class="small">${health==="unavailable"?"Health Connect غير مدعوم على جوالك، أدخل الخطوات يدوياً.":health==="update_required"?"ثبّت تطبيق Health Connect من Play Store حتى تنقرأ خطواتك تلقائياً.":"اربط التطبيق بـ Health Connect حتى تنقرأ خطواتك تلقائياً."}
      ${health!=="unavailable"?`<div style="margin-top:6px"><button class="btn-main btn-sm" data-act="hc-connect">${health==="update_required"?"تثبيت Health Connect":"اربط الخطوات"}</button></div>`:""}</div></div>`):""}
    <div class="row">${[500,1000,2000].map(m=>`<button class="btn-sm" data-act="add-steps" data-m="${m}">+${m.toLocaleString("en")}</button>`).join("")}<span class="small muted">كل 10 دقايق مشي ≈ 1000 خطوة</span></div>
  </section>
  <section class="card">
    <div class="row between"><h2>التقدم نحو ${S.profile.target} كغ</h2><span class="pill">${(prog*100).toFixed(0)}٪</span></div>
    <div class="bar"><i style="width:${prog*100}%"></i></div>
    <div class="grid3">
      <div class="stat"><b>${C.w}</b><span>الوزن الحالي</span></div>
      <div class="stat"><b>${lost>0?lost.toFixed(1):"0"}</b><span>نزلت (كغ)</span></div>

    </div>
    <span class="small muted">بهذا المعدل توصل تقريباً في ${fmtDate(C.goalDate)}.</span>
  </section>
  <section class="card">
    <h2>آخر 7 أيام</h2>
    <svg class="chart" viewBox="0 0 ${Wd} ${H+28}">${bars}
      <line x1="0" x2="${Wd}" y1="${ty}" y2="${ty}" stroke="var(--muted)" stroke-dasharray="4 4"/>
      </svg>
    <span class="small muted">الخط المتقطع = هدفك (${C.target} سعرة). الأحمر = يوم تجاوزت فيه الهدف.</span>
  </section>`;
}

let SAMPLE=null,canImg=false,advText="",advPhoto=null,advURL="",advBusy=false,advRes=null,advErr="",advCtl=null;

function vAdvisor(){
  if(!SAMPLE&&!S.apiKey) return `<section class="card" id="adv"><h2>اسألني قبل ما تاكل</h2><div class="empty">${window.Android?"لتشغيل المستشار داخل التطبيق ضع مفتاح Anthropic API بصفحة «الخطة».":"المستشار يعمل عند فتح التطبيق من داخل Claude."} واستخدم «أضف أكلة» بالأسفل.</div></section>`;
  const camOK=canImg||!!S.apiKey;
  const r=advRes,V={go:"كُلها",reduce:"كُل نصها أو أقل",stop:"لا تاكلها الآن"};
  return `<section class="card" id="adv">
    <h2>اسألني قبل ما تاكل</h2>
    <span class="small muted">اكتب شو ناوي تاكل أو صوّر الصحن، وأنا بحكيلك تاكله ولا لأ وكم.</span>
    <textarea id="adv-text" rows="2" placeholder="مثلاً: صحن مقلوبة دجاج مع لبن وسلطة">${esc(advText)}</textarea>
    ${camOK?`<label class="row" style="flex-direction:row;color:var(--fg)"><input id="adv-photo" type="file" accept="image/*" capture="environment" style="width:auto">صوّر الأكلة</label>`:""}
    ${advURL?`<img class="thumb" src="${advURL}" alt="صورة الأكلة"><button class="btn-sm" data-act="adv-clear-photo">إزالة الصورة</button>`:""}
    <div class="row"><button class="btn-main" data-act="adv-ask" ${advBusy?"disabled":""}>${advBusy?"أحلّل الأكلة...":"احكيلي شو أعمل"}</button>
      ${advBusy?`<button class="btn-sm" data-act="adv-stop">إيقاف</button>`:""}</div>
    ${advErr?`<div class="advice r"><i></i><div class="small">${esc(advErr)}</div></div>`:""}
    ${r?`<div class="verdict ${r.verdict}">
      <div class="row between"><h3>${V[r.verdict]||""}</h3><span class="num">${Math.round(r.kcal)} سعرة · ${Math.round(r.protein)}غ بروتين</span></div>
      <b>${esc(r.meal)}</b>
      <div>${esc(r.headline)}</div>
      ${(r.advice||[]).length?`<ul class="tips">${r.advice.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}
      ${r.swap?`<div class="small"><b>البديل الأفضل:</b> ${esc(r.swap)}</div>`:""}
      <div class="row"><button class="btn-main btn-sm" data-act="adv-log" data-q="1">أكلتها كاملة، سجّلها</button>
        <button class="btn-sm" data-act="adv-log" data-q="0.5">أكلت النص</button>
        <button class="btn-sm" data-act="adv-log" data-q="${r.portion||0.5}">أكلت الكمية المقترحة</button></div>
    </div>`:""}
  </section>`;
}
async function askAdvisor(){
  if(!advText.trim()&&!advPhoto){advErr="اكتب اسم الأكلة أو صوّرها أولاً.";render();return}
  const C=calc(),k=today(),eaten=kcalOf(k),steps=S.steps[k]||0,budget=C.target+Math.round((walkKcal(steps)+exKcal(k))/2);
  const prot=Math.round(sum(dayFood(k),x=>x.p)),now=new Date();
  const prompt=`أنت مدرب تغذية صارم لكن محترم، تتكلم باللهجة الفلسطينية البسيطة. المستخدم رجل عمره ${S.profile.age} سنة، طوله ${S.profile.height} سم، وزنه ${C.w} كغ، هدفه ${S.profile.target} كغ، شغله مكتبي.
وضعه اليوم: الساعة ${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}. هدف السعرات ${budget}، أكل ${eaten} حتى الآن، الباقي ${budget-eaten}. البروتين ${prot}غ من ${C.protein}غ. الخطوات ${steps} من ${S.profile.stepGoal}.
أكل اليوم: ${dayFood(k).map(x=>x.name).join("، ")||"لا شيء بعد"}.
الأكلة التي ينوي أكلها: ${advText.trim()||"(انظر الصورة)"}${advPhoto?"\nمرفقة صورة للصحن، قدّر الكمية من الصورة.":""}
قدّر السعرات والبروتين بواقعية للمطبخ الفلسطيني (انتبه لزيت الزيتون والخبز). قرّر: go إذا تناسب الباقي، reduce إذا لازم يقلل الكمية، stop إذا رح يتجاوز كثيراً أو الوقت متأخر جداً.
أجب بـ JSON فقط بهذا الشكل:
{"meal":"اسم مختصر للأكلة","kcal":0,"protein":0,"verdict":"go|reduce|stop","portion":1,"headline":"جملة واحدة مباشرة","advice":["نصيحة عملية قصيرة","..."],"swap":"بديل أخف أو تعديل بسيط"}
portion هو الجزء المسموح أكله (مثلاً 0.5). advice من 2 إلى 4 نقاط.`;
  advBusy=true;advErr="";advRes=null;render();advCtl=new AbortController();
  try{
    const res=SAMPLE?await SAMPLE.json(prompt,{signal:advCtl.signal,images:advPhoto&&canImg?[advPhoto]:undefined,cache:false}):await apiJSON(prompt,advPhoto,advCtl.signal);
    if(!res||typeof res.kcal!=="number") throw {code:"invalid_json"};
    advRes=res;
  }catch(e){
    advErr={not_granted:"لازم تسمح للتطبيق باستخدام Claude حتى يشتغل المستشار.",rate_limited:"طلبات كثيرة، جرّب بعد شوي.",image_rejected:"الصورة ما انقرأت، جرّب صورة ثانية.",invalid_json:"ما فهمت الرد، اضغط مرة ثانية.",cancelled:"",bad_key:"مفتاح API غير صحيح أو بدون رصيد. راجعه بصفحة الخطة.",offline:"ما في إنترنت.",bad_request:"الطلب ما انقبل، جرّب صورة أصغر أو اكتب الأكلة."}[e.code]??"صار خطأ بالاتصال، جرّب مرة ثانية.";
    if(e.code==="not_granted"||e.code==="sampling_disabled") SAMPLE=null;
  }finally{advBusy=false;render()}
}

function vWeight(){

  const vals=ws.map(x=>x.w).concat([p.start,p.start-p.pace*span/7>p.target?p.start-p.pace*span/7:p.target]);
  const ymax=Math.ceil(Math.max(...vals)+1),ymin=Math.floor(Math.min(...vals)-1);
  const X=d=>pl+(W-pl-pr)*(1-d/span); // RTL: البداية يمين

function imgToB64(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=1024,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.82).split(",")[1])};im.onerror=()=>no({code:"image_rejected"});im.src=u})}
async function apiJSON(prompt,img,signal){
  const content=[];if(img)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await imgToB64(img)}});
  content.push({type:"text",text:prompt+"\nاكتب JSON فقط بدون أي نص قبله أو بعده."});
  let r;try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":S.apiKey,
    "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1200,messages:[{role:"user",content}]})})}
  catch(e){throw{code:e.name==="AbortError"?"cancelled":"offline"}}
  if(!r.ok)throw{code:r.status===401||r.status===403?"bad_key":r.status===429?"rate_limited":r.status===400?"bad_request":"upstream_error"};
  const j=await r.json(),t=(j.content||[]).map(c=>c.text||"").join(""),m=t.match(/\{[\s\S]*\}/);
  if(!m)throw{code:"invalid_json"};return JSON.parse(m[0])}

    const recent=ws.filter(x=>daysBetween(x.d,last.d)<=21);
    const rDrop=recent[0].w-last.w, rSpan=daysBetween(recent[0].d,last.d);
    if(rSpan>=14&&rDrop<0.3) out.push(["r","الوزن ثابت آخر "+Math.round(rSpan/7)+" أسابيع","هذا طبيعي ويصير لكل الناس. شيك على النقاط تحت: غالباً السبب أكل مش مسجل، أو مشي قليل. لو كل شيء مضبوط، نزّل هدفك اليومي 100 سعرة لمدة أسبوعين."]);
    else if(rate>1.1) out.push(["w","نازل بسرعة ("+rate.toFixed(1)+" كغ/أسبوع)","سرعة عالية. زيد أكلك شوي وركز على البروتين حتى ما تخسر عضل وما يرجع الوزن."]);
    else if(rate>0) out.push(["","ماشي صح ("+rate.toFixed(1)+" كغ/أسبوع)","استمر على نفس النظام. الثبات أهم من السرعة."]);
    else out.push(["r","الوزن ما نزل من البداية","أكلك الفعلي غالباً أعلى من المسجل. سجّل كل شيء لمدة أسبوع كامل حتى الشاي والزيت."]);
  }
  if(logged.length<5) out.push(["w","سجّلت أكلك "+logged.length+" أيام من آخر 7","التسجيل اليومي هو سر النجاح. حتى الأيام اللي بتاكل فيها كثير، سجّلها."]);
  else if(avgK>C.target+150) out.push(["r","معدل أكلك "+avgK+" سعرة","أعلى من هدفك ("+C.target+") بـ "+(avgK-C.target)+". شوف وين بتروح السعرات: الخبز والزيت والحلو والشاي بالسكر أكثر شيء."]);
  else if(avgK&&avgK<C.target-400) out.push(["w","معدل أكلك "+avgK+" سعرة","أقل من اللازم بكثير. الأكل القليل جداً يبطئ الحرق ويخليك تجوع وترجع تاكل كثير."]);
  else if(avgK) out.push(["","معدل أكلك "+avgK+" سعرة","قريب من هدفك. ممتاز."]);
  if(avgSteps<S.profile.stepGoal*0.75) out.push(["w","معدل مشيك "+Math.round(avgSteps).toLocaleString("en")+" خطوة يومياً","هدفك "+S.profile.stepGoal.toLocaleString("en")+". مشي بعد الغدا أو العشا أسهل وقت."]);
  if(avgWater<C.water*0.7) out.push(["w","الماء قليل","معدلك "+avgWater.toFixed(1)+" كاسات من "+C.water+". العطش كثير مرات بنحسه جوع."]);
  return out;
}

/* ---------- الأحداث ---------- */
document.addEventListener("change",e=>{
  if(e.target.id==="adv-photo"){const f=e.target.files?.[0];if(f){if(advURL)URL.revokeObjectURL(advURL);advPhoto=f;advURL=URL.createObjectURL(f);render()}}
});
document.addEventListener("input",e=>{
  if(e.target.id==="adv-text"){advText=e.target.value;return}
  if(e.target.id==="fsearch"){fq=e.target.value.trim();const pos=e.target.selectionStart;render();const i=document.getElementById("fsearch");i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,k=today();
  if(a==="close-bg"&&e.target!==b)return;
  switch(a){
    case"open-add":if(tab!=="food")foodDay=k;openSheet();break;
    case"close":case"close-bg":closeSheet();break;
    case"meal":fmeal=b.dataset.m;render();break;
    case"cat":fc=b.dataset.c;render();break;
    case"pick":fsel=fsel===b.dataset.n?null:b.dataset.n;render();break;
    case"add-food":{const f=allFoods().find(x=>x[1]===b.dataset.n),q=+b.dataset.q;
      (S.food[foodDay]=S.food[foodDay]||[]).push({id:Date.now(),name:f[1],kcal:f[2]*q,p:f[3]*q,q,meal:fmeal,t:new Date().getHours()});
      save();fsel=null;render();toast("أُضيف: "+f[1]);break}
    case"del-food":S.food[foodDay]=dayFood(foodDay).filter(x=>x.id!=b.dataset.id);save();render();break;
    case"day":{const n=addDays(foodDay,+b.dataset.n);if(n<=k){foodDay=n;render()}break}
    case"water":{const n=+b.dataset.n;S.water[k]=(S.water[k]===n?n-1:n);save();render();break}
    case"add-steps":S.steps[k]=(S.steps[k]||0)+ +b.dataset.m;save();render();toast("أحسنت، كمّل");break;
    case"set-steps":{const v=+document.getElementById("st").value;if(v>=0&&v<100000){S.steps[k]=Math.round(v);save();render();toast("تحدّث عداد الخطوات")}break}
    case"adv-ask":askAdvisor();break;
    case"adv-stop":advCtl?.abort();break;
    case"adv-clear-photo":if(advURL)URL.revokeObjectURL(advURL);advPhoto=null;advURL="";render();break;
    case"adv-log":{const q=+b.dataset.q,r=advRes;if(!r)break;
      (S.food[k]=S.food[k]||[]).push({id:Date.now(),name:r.meal,kcal:r.kcal*q,p:r.protein*q,q,meal:autoMeal(),t:new Date().getHours()});
      save();advRes=null;advText="";if(advURL)URL.revokeObjectURL(advURL);advPhoto=null;advURL="";foodDay=k;render();toast("سُجّلت: "+r.meal);break}
    case"ex-level":S.exLevel=+b.dataset.i;save();render();break;
    case"ex-start":startWorkout(b.dataset.id);break;
    case"ex-pause":P.paused=!P.paused;drawPlayer();break;
    case"ex-skip":P.left=1;tick();break;
    case"ex-quit":finishWorkout(false);break;
    case"hc-connect":try{Android.connectHealth()}catch(e){}break;
    case"save-key":S.apiKey=document.getElementById("apikey").value.trim();save();render();toast(S.apiKey?"حُفظ المفتاح":"حُذف المفتاح");break;
    case"del-key":S.apiKey="";save();render();toast("حُذف المفتاح");break;
    case"go-adv":tab="food";render();document.getElementById("adv")?.scrollIntoView({behavior:"smooth"});break;
    case"add-custom":{const n=document.getElementById("cn").value.trim(),kc=+document.getElementById("ck").value,pr=+document.getElementById("cp").value||0;
      if(!n||!kc){toast("اكتب الاسم والسعرات");break}
      S.custom.push(["أكلاتي",n,kc,pr]);save();render();toast("حُفظت الأكلة");break}
    case"del-custom":S.custom.splice(+b.dataset.i,1);save();render();break;
    case"add-weight":{const w=+document.getElementById("wv").value,d=document.getElementById("wd").value||k;
      if(!(w>30&&w<300)){toast("اكتب وزن صحيح");break}
      S.weights=S.weights.filter(x=>x.d!==d);S.weights.push({d,w});save();render();toast("سُجّل الوزن");break}
    case"del-weight":if(S.weights.length>1){S.weights=S.weights.filter(x=>x.d!==b.dataset.d);save();render()}else toast("لازم يبقى وزن واحد على الأقل");break;
    case"save-profile":{const g=id=>document.getElementById("p-"+id).value;
      Object.assign(S.profile,{name:g("name"),sex:g("sex"),age:+g("age"),height:+g("height"),start:+g("start"),target:+g("target"),startDate:g("startDate"),pace:+g("pace"),activity:+g("activity"),stepGoal:+g("stepGoal")||8000});
      save();render();toast("حُفظت الخطة");break}
    case"export":{const t=JSON.stringify(S,(k,v)=>k==="apiKey"?undefined:v),ta=document.getElementById("bk");ta.value=t;
      navigator.clipboard?.writeText(t).then(()=>toast("نُسخت البيانات"),()=>{ta.select();toast("حدّد النص وانسخه")}) ?? (ta.select(),toast("حدّد النص وانسخه"));break}
    case"import":{try{const o=JSON.parse(document.getElementById("bk").value);if(!o.profile||!o.weights)throw 0;o.apiKey=S.apiKey;S=o;save();render();toast("تم الاستيراد")}catch(err){toast("النص غير صالح. الصق النسخة كاملة")}break}
    case"reset":document.getElementById("confirm").innerHTML=`<div class="advice r"><i></i><div><b>متأكد؟</b> سيُحذف كل سجلك.<div class="row" style="margin-top:8px"><button class="btn-danger btn-sm" data-act="reset-yes">نعم، امسح</button><button class="btn-sm" data-act="reset-no">لا</button></div></div></div>`;break;
    case"reset-yes":S=JSON.parse(JSON.stringify(DEF));save();render();toast("بداية جديدة");break;
    case"reset-no":document.getElementById("confirm").innerHTML="";break;
  }
});
render();
